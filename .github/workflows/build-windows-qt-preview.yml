name: Windows Qt preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-qt.txt
            requirements-build-qt.txt

      - name: Install build dependencies
        run: python -m pip install --upgrade -r requirements-build-qt.txt

      - name: Build and test Qt preview
        shell: pwsh
        run: .\build_windows_qt.ps1 -SkipInstall

      - name: Upload visual QA report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: UmaLegacyLinker-Qt-Visual-QA
          path: artifacts/ui-audit
          if-no-files-found: warn

      - name: Upload preview artifact
        uses: actions/upload-artifact@v7
        with:
          name: UmaLegacyLinker-Qt-Preview-Windows
          path: |
            dist/UmaLegacyLinkerQt-preview-win64.zip
            dist/UmaLegacyLinkerQt-preview-win64.zip.sha256
