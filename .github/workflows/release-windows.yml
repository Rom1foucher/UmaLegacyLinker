name: Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt build dependencies
        run: python -m pip install --upgrade -r requirements-build-qt.txt

      - name: Build and test Qt application
        shell: pwsh
        run: .\build_windows_qt.ps1 -SkipInstall -RunLayoutAudit

      - name: Upload visual QA report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: UmaLegacyLinker-Qt-Visual-QA
          path: artifacts/ui-audit
          if-no-files-found: warn

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: UmaLegacyLinker-Qt-Windows
          path: |
            dist/UmaLegacyLinkerQt-win64.zip
            dist/UmaLegacyLinkerQt-win64.zip.sha256

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/UmaLegacyLinkerQt-win64.zip dist/UmaLegacyLinkerQt-win64.zip.sha256 --clobber
          } else {
            gh release create $tag dist/UmaLegacyLinkerQt-win64.zip dist/UmaLegacyLinkerQt-win64.zip.sha256 --generate-notes --title "$tag"
          }
